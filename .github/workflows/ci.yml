name: CI

# Automatic pull_request and push runs are muted: a hosted macOS full run takes
# about 45-55 minutes. Run manually from the Actions tab until CI is split up.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Verification profile
        type: choice
        default: full
        options:
          - focused
          - full

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: inputs.profile == 'focused'
        run: |
          if ! git show-ref --verify --quiet refs/heads/main; then
            git branch main origin/main
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - run: |
          if [ -n "$VERIFICATION_PROFILE" ]; then
            bun run verify --"$VERIFICATION_PROFILE"
          else
            bun run verify
          fi
        env:
          VERIFICATION_PROFILE: ${{ inputs.profile || 'full' }}
      - if: github.event_name == 'workflow_dispatch' && inputs.profile == 'full'
        run: bun run release:dry-run
        env:
          FLOW_PACKAGES_PREBUILT: '1'
