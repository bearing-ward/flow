name: CI

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Verification profile
        type: choice
        default: full
        options:
          - focused
          - full
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - run: |
          if [ -n "$VERIFICATION_PROFILE" ]; then
            bun run verify --"$VERIFICATION_PROFILE"
          else
            bun run verify
          fi
        env:
          VERIFICATION_PROFILE: ${{ inputs.profile || '' }}
      - if: github.event_name == 'workflow_dispatch' && inputs.profile == 'full'
        run: bun run release:dry-run
