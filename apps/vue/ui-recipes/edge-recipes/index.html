<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Flow Vue edge and connection recipes</title>
    <style>
      body {
        margin: 0;
      }

      .recipe-root .flow-vue-canvas {
        width: 100vw;
        height: 100vh;
        margin: 0;
        border: 0;
        border-radius: 0;
      }

      .recipe-panel {
        position: absolute;
        z-index: 20;
        top: 8px;
        right: 8px;
        display: flex;
        gap: 8px;
        align-items: center;
        font:
          12px system-ui,
          sans-serif;
      }

      .recipe-edge-button {
        width: 22px;
        height: 22px;
        padding: 0;
        border: 1px solid #fff;
        border-radius: 50%;
        background: #eee;
        cursor: pointer;
        font-size: 12px;
        line-height: 1;
      }

      .recipe-edge-button:hover {
        box-shadow: 0 0 6px 2px #00000014;
      }

      .recipe-edge-label {
        padding: 4px 8px;
        border-radius: 4px;
        background: #fde68a;
        font:
          12px system-ui,
          sans-serif;
      }

      .recipe-hidden-handles .flow-vue-handle {
        opacity: 0;
        pointer-events: none;
      }

      /* Selected nodes keep their source handles reachable for a multi-line drag. */
      .recipe-multi-connection .flow-vue-resize-handle {
        display: none;
      }

      .recipe-easy-connect .flow-vue-node {
        padding: 0;
        display: grid;
        place-items: center;
        background: #ccc;
      }

      .recipe-easy-connect .flow-vue-handle {
        z-index: 1;
        inset: 0;
        width: 100%;
        height: 100%;
        transform: none;
        border: 0;
        border-radius: 0;
        opacity: 0;
      }

      .recipe-easy-strip {
        position: absolute;
        z-index: 2;
        top: 0;
        right: 0;
        left: 0;
        height: 14px;
        background: #ff6060;
        cursor: move;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/edge-recipes-test.ts"></script>
  </body>
</html>
