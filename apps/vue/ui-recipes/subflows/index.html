<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Flow Vue sub-flow recipes</title>
    <style>
      body {
        margin: 0;
      }

      .recipe-root .flow-vue-canvas {
        width: 100vw;
        height: 100vh;
        margin: 0;
        border: 0;
        border-radius: 0;
      }

      .recipe-root .flow-vue-node {
        box-sizing: border-box;
      }

      .recipe-root .flow-vue-node:has(> .recipe-group-body) {
        padding: 6px 8px;
        border: 1px dashed #6366f1;
        background: #6366f114;
        box-shadow: none;
      }

      .recipe-group-body {
        color: #4338ca;
        font:
          600 11px system-ui,
          sans-serif;
      }

      .recipe-panel {
        position: absolute;
        z-index: 20;
        top: 8px;
        right: 8px;
        display: flex;
        gap: 8px;
        align-items: center;
        font:
          12px system-ui,
          sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/subflows-recipes.ts"></script>
  </body>
</html>
