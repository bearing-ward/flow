<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Flow Vue whiteboard recipes</title>
    <style>
      body {
        margin: 0;
      }

      .recipe-root .flow-vue-canvas {
        width: 100vw;
        height: 100vh;
        margin: 0;
        border: 0;
        border-radius: 0;
      }

      .recipe-root .flow-vue-node {
        box-sizing: border-box;
      }

      .recipe-root .flow-vue-node:has(> .recipe-shape) {
        min-height: 0;
        padding: 0;
        box-shadow: none;
      }

      .recipe-root .flow-vue-node:has(> .recipe-freehand) {
        border-color: transparent;
        background: transparent;
      }

      .recipe-shape {
        position: absolute;
        inset: 0;
      }

      .recipe-rectangle {
        background: #bfdbfe80;
      }

      .recipe-freehand {
        overflow: visible;
        width: 100%;
        height: 100%;
      }

      .recipe-toolbar {
        position: absolute;
        z-index: 30;
        top: 8px;
        left: 8px;
        display: flex;
        gap: 6px;
        align-items: center;
        font:
          12px system-ui,
          sans-serif;
      }

      .recipe-toolbar button[aria-pressed='true'] {
        background: #1d4ed8;
        color: white;
      }

      .recipe-tool-overlay {
        position: absolute;
        z-index: 25;
        inset: 0;
      }

      .recipe-tool-overlay svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/whiteboard-recipes.ts"></script>
  </body>
</html>
