<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow vanilla host</title>
    <style>
      .launch-help {
        box-sizing: border-box;
        max-width: 44rem;
        margin: 4rem auto;
        padding: 2rem;
        border: 1px solid #d9dee8;
        border-radius: 0.75rem;
        background: #ffffff;
        color: #172033;
        font:
          16px/1.5 system-ui,
          sans-serif;
        box-shadow: 0 1rem 3rem rgb(20 32 57 / 8%);
      }

      .launch-help h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }

      .launch-help code {
        padding: 0.15rem 0.35rem;
        border-radius: 0.25rem;
        background: #eef1f6;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <section class="launch-help" aria-labelledby="launch-title">
        <h1 id="launch-title">Start the Flow development server</h1>
        <p>
          This host uses Vite and cannot run directly from a
          <code>file://</code> URL.
        </p>
        <p>
          Run <code>bun run dev</code> from the project root, then open
          <a href="http://127.0.0.1:4173">http://127.0.0.1:4173</a>.
        </p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
